services:
  app:
    build: .
    image: frameseq-review:20261022
    ports:
      - "127.0.0.1:${FRAMESEQ_PORT:-18081}:18080"
    volumes:
      - review-data:/var/lib/frameseq
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    restart: "no"
    stop_grace_period: 20s

volumes:
  review-data:
