<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录创作空间 · 帧序</title><link rel="stylesheet" href="/assets/studio-v3.css?v=design-20261021-v1"><link rel="stylesheet" href="/assets/explore.css?v=design-20261021-v1"><script defer src="/assets/session.js"></script><script type="module" src="/assets/login.js?v=registration-20261020"></script></head><body><header class="public-header"><a class="brand" href="/">◩ 帧序<small>STUDIO</small></a><a href="/explore">探索作品 ↗</a></header><main class="auth-main"><section class="auth-intro"><p class="eyebrow">YOUR STORY STARTS HERE</p><h1>把灵感，留在自己的空间。</h1><p>保存剧集、编排镜头、选择喜欢的版本。</p><div class="auth-note">邀请预览中<br>作品默认私有 · 本地任务有限额<br>新任务使用本地模型 · 云API已停用</div></section><section class="auth-card"><div class="auth-tabs"><button id="login-tab" aria-pressed="true">登录</button><button id="register-tab" aria-pressed="false">注册新账号</button></div><h2 id="auth-title">登录你的创作空间</h2><p id="auth-guidance" class="auth-guidance">已有账号直接登录，新用户可注册。</p><form id="auth-form"><label>用户名<input id="username" autocomplete="username" minlength="3" maxlength="32" pattern="[a-z0-9_]{3,32}" required placeholder="3–32位字母、数字或下划线"></label><label>密码<input id="password" type="password" autocomplete="current-password" maxlength="128" required></label><div id="register-fields" hidden><label>显示名称<input id="display-name" maxlength="60" autocomplete="nickname"></label><label>邀请码<input id="invite" maxlength="100" autocomplete="off" placeholder="由管理员提供，仅可使用一次"></label></div><button class="primary-button" id="auth-submit">登录创作空间 ↗</button><p id="auth-message" role="status"></p></form><button type="button" id="switch-mode" class="auth-switch">没有账号？注册新账号</button><p class="helper">请使用本站独立密码。管理员初始密码由部署者在私有文件中保存，页面不会显示。</p><div id="account" hidden><p id="account-name"></p><a class="primary-button" href="/studio">进入创作空间</a><button id="create-invite" class="secondary-button" hidden>创建一次性邀请码</button><output id="invite-result"></output><details class="password-change"><summary>修改登录密码</summary><form id="password-form"><label>当前密码<input id="current-password" type="password" autocomplete="current-password" maxlength="128" required></label><label>新密码<input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button class="secondary-button">保存并退出所有会话</button><p id="password-message" role="status"></p></form></details></div></section></main></body></html>
